services:
  - type: web
    name: styleverse-backend
    env: python
    rootDir: .
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install --no-cache-dir torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt"
    startCommand: "PYTHONPATH=.:backend uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_NAME
        value: styleverse
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
